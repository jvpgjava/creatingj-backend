openapi: 3.1.0
info:
  title: CreatingJ API
  description: Contrato versionado da plataforma CreatingJ
  version: v1
servers:
- url: /
  description: Same origin
tags:
- name: Usage
  description: Consulta de consumo proprio e limites configurados
- name: Account Access
  description: "Ativacao de convite, login por sessao e redefinicao de senha"
- name: Multi-Client Auth
  description: "Sessao web por cookie/CSRF, PKCE S256 para apps publicos e sessoes"
- name: Conversations
  description: "Conversas, historico, chat sincrono, streaming SSE e cancelamento"
- name: Agent Orchestration
  description: "Planejamento de agente, contexto de workspace e guardrails de tools"
- name: System
  description: Diagnostico basico e metadados publicos da API v1
- name: Runner Protocol
  description: Endpoints exclusivos do runner local (creatingj-agent)
- name: Knowledge RAG
  description: "Ingestao, indexacao vetorial pgvector e busca RAG isolada por projeto"
- name: Projects
  description: Gestao de projetos isolados por proprietario
- name: Devices
  description: "Pareamento, presenca e revogacao de dispositivos autorizados"
- name: Remote Tasks
  description: "Fila de tarefas remotas, cancelamento, aprovacoes pontuais e SSE"
- name: Admin Usage
  description: Visao administrativa de consumo e configuracao de quotas (restrito
    a ADMIN)
- name: Admin Maintenance
  description: Politica de retencao e manutencao operacional (ROLE_ADMIN)
- name: Admin Users
  description: Gestao administrativa de contas CreatingJ (restrito a ADMIN)
paths:
  /api/v1/admin/users/{userId}/quota:
    put:
      tags:
      - Admin Usage
      summary: Configurar quotas diarias e limite de concorrencia de um usuario
      operationId: updateUserQuota
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserQuotaRequest"
        required: true
      responses:
        "200":
          description: Quota atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserQuotaResponse"
        "400":
          description: Limites invalidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Sem privilegio administrativo
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Usuario nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/tasks:
    get:
      tags:
      - Remote Tasks
      summary: Listar tarefas remotas recentes do usuario
      operationId: listRemoteTasks
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Lista de tarefas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteTasksResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
    post:
      tags:
      - Remote Tasks
      summary: Enfileirar tarefa remota para dispositivo autorizado
      operationId: createRemoteTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRemoteTaskRequest"
        required: true
      responses:
        "201":
          description: Tarefa criada ou deduplicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRemoteTaskResponse"
        "400":
          description: Entrada invalida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Dispositivo ou projeto nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Dispositivo revogado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/tasks/{taskId}/cancel:
    post:
      tags:
      - Remote Tasks
      summary: Cancelar tarefa remota e rejeitar aprovacoes pendentes
      operationId: cancelRemoteTask
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Tarefa cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteTaskSummaryResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Tarefa nao encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/tasks/{taskId}/approvals/{approvalId}/decision:
    post:
      tags:
      - Remote Tasks
      summary: Aprovar ou rejeitar solicitacao pontual do runner
      operationId: decideRemoteToolApproval
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolApprovalDecisionRequest"
        required: true
      responses:
        "200":
          description: Decisao registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolApprovalDecisionResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Tarefa ou aprovacao nao encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Aprovacao expirada ou ja decidida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/runner/tasks/{taskId}/events:
    post:
      tags:
      - Runner Protocol
      summary: Reportar evento de progresso com deduplicacao
      operationId: reportRunnerTaskEvent
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerTaskEventRequest"
        required: true
      responses:
        "200":
          description: Evento registrado ou deduplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerTaskEventResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Tarefa nao encontrada para este dispositivo
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - deviceTokenAuth: []
  /api/v1/runner/tasks/{taskId}/complete:
    post:
      tags:
      - Runner Protocol
      summary: Concluir ou falhar tarefa atribuida ao dispositivo
      operationId: completeRunnerTask
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerCompleteTaskRequest"
        required: true
      responses:
        "200":
          description: Tarefa finalizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteTaskSummaryResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Tarefa nao encontrada para este dispositivo
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - deviceTokenAuth: []
  /api/v1/runner/tasks/{taskId}/approvals:
    post:
      tags:
      - Runner Protocol
      summary: Solicitar aprovacao pontual com TTL para tool
      operationId: requestRunnerToolApproval
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerApprovalRequest"
        required: true
      responses:
        "201":
          description: Aprovacao criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolApprovalResponse"
        "400":
          description: Ferramenta ou comando bloqueado por politica
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Tarefa nao encontrada para este dispositivo
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - deviceTokenAuth: []
  /api/v1/runner/tasks/lease:
    post:
      tags:
      - Runner Protocol
      summary: Adquirir lease da proxima tarefa destinada ao runner
      operationId: leaseNextRunnerTask
      responses:
        "200":
          description: Resultado do lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerLeaseResponse"
        "401":
          description: Credencial de dispositivo invalida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - deviceTokenAuth: []
  /api/v1/runner/pair/complete:
    post:
      tags:
      - Runner Protocol
      summary: Trocar codigo de pareamento de uso unico por credencial de dispositivo
      operationId: completeDevicePairing
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePairingRequest"
        required: true
      responses:
        "200":
          description: Dispositivo pareado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletePairingResponse"
        "401":
          description: Codigo invalido ou expirado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/runner/heartbeat:
    post:
      tags:
      - Runner Protocol
      summary: Registrar heartbeat de presenca do dispositivo autenticado
      operationId: recordDeviceHeartbeat
      responses:
        "200":
          description: Heartbeat registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSummaryResponse"
        "401":
          description: Credencial de dispositivo invalida ou revogada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - deviceTokenAuth: []
  /api/v1/projects:
    get:
      tags:
      - Projects
      summary: Listar projetos do usuario autenticado
      operationId: listProjects
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Pagina de projetos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectsPageResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
    post:
      tags:
      - Projects
      summary: Criar um projeto proprio
      operationId: createProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
        required: true
      responses:
        "201":
          description: Projeto criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          description: Entrada invalida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Slug ja utilizado na conta
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/projects/{projectId}/knowledge/sources:
    get:
      tags:
      - Knowledge RAG
      summary: Listar fontes indexadas de um projeto proprio
      operationId: listKnowledgeSources
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Lista de fontes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSourcesResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Projeto nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
    post:
      tags:
      - Knowledge RAG
      summary: Ingerir ou atualizar fonte de conhecimento de um projeto com deduplicacao
        e pgvector
      operationId: ingestKnowledgeSource
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestKnowledgeSourceRequest"
        required: true
      responses:
        "200":
          description: Fonte ingerida ou deduplicada sem alteracao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestKnowledgeSourceResponse"
        "400":
          description: "Caminho sensivel, segredo ou payload invalido"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Projeto nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/projects/{projectId}/knowledge/search:
    post:
      tags:
      - Knowledge RAG
      summary: Executar busca vetorial pgvector filtrada por proprietario e projeto
      operationId: searchProjectKnowledge
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSearchRequest"
        required: true
      responses:
        "200":
          description: Trechos mais relevantes com citacao de fonte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchResponse"
        "400":
          description: Consulta invalida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Projeto nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/projects/{projectId}/agent/runs:
    get:
      tags:
      - Agent Orchestration
      summary: Listar execucoes recentes de agente do projeto
      operationId: listAgentRuns
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Lista de execucoes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunsResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Projeto nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
    post:
      tags:
      - Agent Orchestration
      summary: "Planejar acoes de agente com contexto do workspace, RAG e guardrails\
        \ deterministicos"
      operationId: createAgentRun
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRunRequest"
        required: true
      responses:
        "201":
          description: Plano e propostas avaliadas criados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunDetailResponse"
        "400":
          description: Entrada ou snapshot de workspace invalido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Projeto nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Quota ou limite de concorrencia excedido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/projects/{projectId}/agent/runs/{runId}/proposals/{proposalId}/decision:
    post:
      tags:
      - Agent Orchestration
      summary: Aprovar ou rejeitar proposta pendente de ferramenta do agente
      operationId: decideToolProposal
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: runId
        in: path
        required: true
        schema:
          type: string
      - name: proposalId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolProposalDecisionRequest"
        required: true
      responses:
        "200":
          description: Decisao registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolProposalDecisionResponse"
        "409":
          description: Estado invalido ou proposta negada por politica
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Execucao ou proposta nao encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/projects/{projectId}/agent/runs/{runId}/cancel:
    post:
      tags:
      - Agent Orchestration
      summary: Cancelar execucao do agente e rejeitar propostas pendentes
      operationId: cancelAgentRun
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: runId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Execucao cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunSummaryResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Execucao nao encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/devices/{deviceId}/revoke:
    post:
      tags:
      - Devices
      summary: Revogar dispositivo e invalidar suas credenciais
      operationId: revokeDevice
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Dispositivo revogado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSummaryResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Dispositivo nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/devices/pairing-challenges:
    post:
      tags:
      - Devices
      summary: Gerar codigo de pareamento de uso unico
      operationId: createPairingChallenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePairingChallengeRequest"
        required: true
      responses:
        "201":
          description: Codigo gerado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingChallengeResponse"
        "400":
          description: Entrada invalida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/conversations:
    get:
      tags:
      - Conversations
      summary: Listar conversas do usuario autenticado de forma paginada
      operationId: listOwnConversations
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Pagina de conversas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationsPageResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
    post:
      tags:
      - Conversations
      summary: Criar nova conversa do usuario autenticado
      operationId: createConversation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
        required: true
      responses:
        "201":
          description: Conversa criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummaryResponse"
        "400":
          description: Entrada invalida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
