          example: crj_act_4f8e1a2b3c4d5e6f7a8b9c0d1e2f3a4b
          maxLength: 256
          minLength: 0
        password:
          type: string
          description: "Senha forte (minimo 12 caracteres, com maiuscula, minuscula,\
            \ numero e simbolo)"
          example: CriarJ@2026#Forte
