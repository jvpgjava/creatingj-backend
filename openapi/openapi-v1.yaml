openapi: 3.1.0
info:
  title: CreatingJ API
  description: Contrato versionado da plataforma CreatingJ
  version: v1
servers:
- url: /
  description: Same origin
tags:
- name: Account Access
  description: "Ativacao de convite, login por sessao e redefinicao de senha"
- name: Multi-Client Auth
  description: "Sessao web por cookie/CSRF, PKCE S256 para apps publicos e sessoes"
- name: Conversations
  description: "Conversas, historico, chat sincrono, streaming SSE e cancelamento"
- name: System
  description: Diagnostico basico e metadados publicos da API v1
- name: Admin Users
  description: Gestao administrativa de contas CreatingJ (restrito a ADMIN)
paths:
  /api/v1/conversations:
    get:
      tags:
      - Conversations
      summary: Listar conversas do usuario autenticado de forma paginada
      operationId: listOwnConversations
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Pagina de conversas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationsPageResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
    post:
      tags:
      - Conversations
      summary: Criar nova conversa do usuario autenticado
      operationId: createConversation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
        required: true
      responses:
        "201":
          description: Conversa criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummaryResponse"
        "400":
          description: Entrada invalida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/conversations/{conversationId}/messages:
    post:
      tags:
      - Conversations
      summary: Enviar mensagem e receber resposta sincrona do modelo
      operationId: sendMessage
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
        required: true
      responses:
        "200":
          description: Resposta gerada e persistida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageExchangeResponse"
        "404":
          description: Conversa nao encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Limite de taxa do provedor excedido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: Erro sanitizado de integracao com provedor
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: Provedor temporariamente indisponivel
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "504":
          description: Tempo limite do provedor excedido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/conversations/{conversationId}/messages/stream:
    post:
      tags:
      - Conversations
      summary: Enviar mensagem e receber resposta em streaming SSE
      description: "Emite eventos SSE com id sequencial: generation.started, generation.delta,\
        \ generation.completed, generation.cancelled ou generation.failed."
      operationId: streamMessageGeneration
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
        required: true
      responses:
        "200":
          description: Stream SSE iniciado
          content:
            text/event-stream: {}
        "404":
          description: Conversa nao encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/conversations/{conversationId}/generations/{generationId}/cancel:
    post:
      tags:
      - Conversations
      summary: Cancelar geracao em andamento da conversa
      operationId: cancelGeneration
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      - name: generationId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Status da geracao apos cancelamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationSummaryResponse"
        "404":
          description: Conversa ou geracao nao encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/auth/web/login:
    post:
      tags:
      - Multi-Client Auth
      summary: Autenticar na web emitindo cookie HttpOnly + XSRF-TOKEN
      description: Autentica conta ativa para o navegador sem expor token no corpo
        JSON.
      operationId: webCookieLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Sessao web iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebLoginResponse"
        "401":
          description: Credenciais invalidas
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Limite de tentativas excedido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/auth/token/refresh:
    post:
      tags:
      - Multi-Client Auth
      summary: Rotacionar refreshToken emitindo novo par de tokens
      description: Detecta reuso de refreshToken rotacionado e revoga toda a familia
        de sessoes.
      operationId: refreshSessionToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: Novo par de tokens emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "401":
          description: "Refresh token invalido, expirado ou reutilizado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/auth/pkce/token:
    post:
      tags:
      - Multi-Client Auth
      summary: Trocar codigo de autorizacao + code_verifier por accessToken e refreshToken
      operationId: exchangePkceCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PkceTokenRequest"
        required: true
      responses:
        "200":
          description: Par de tokens emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "401":
          description: Validacao PKCE ou codigo invalido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Codigo ja utilizado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/auth/pkce/authorize:
    post:
      tags:
      - Multi-Client Auth
      summary: Emitir codigo de autorizacao PKCE S256 para cliente publico
      operationId: authorizePkceClient
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PkceAuthorizeRequest"
        required: true
      responses:
        "200":
          description: Codigo de autorizacao emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkceAuthorizeResponse"
        "400":
          description: "Cliente, redirectUri ou codeChallenge invalido"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/auth/password-reset/request:
    post:
      tags:
      - Account Access
      summary: Solicitar redefinicao de senha
      description: Retorna resposta neutra sem confirmar a existencia do email.
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
        required: true
      responses:
        "202":
          description: Solicitacao aceita
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestedResponse"
        "400":
          description: Email invalido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/auth/password-reset/confirm:
    post:
      tags:
      - Account Access
      summary: Confirmar redefinicao de senha com token unico
      description: Atualiza o hash de senha e revoga sessoes anteriores.
      operationId: confirmPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPasswordResetRequest"
        required: true
      responses:
        "204":
          description: Senha redefinida
        "400":
          description: Token invalido/expirado ou senha fraca
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Token ja utilizado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/auth/logout:
    post:
      tags:
      - Multi-Client Auth
      summary: Encerrar sessao atual e limpar cookies
      description: Revoga imediatamente a sessao corrente no servidor.
      operationId: logoutCurrentSession
      responses:
        "204":
          description: Sessao encerrada
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Token CSRF ausente ou invalido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/auth/login:
    post:
      tags:
      - Account Access
      summary: Autenticar conta ativa com email e senha
      description: Emite token de sessao opaco com protecao contra brute force e enumeracao.
      operationId: loginWithPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credenciais invalidas ou conta indisponivel
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Limite de tentativas excedido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/auth/activate:
    post:
      tags:
      - Account Access
      summary: Ativar conta com token de uso unico
      description: Define a senha inicial com Argon2id e conclui a ativacao da conta.
      operationId: activateAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateAccountRequest"
        required: true
      responses:
        "204":
          description: Conta ativada com sucesso
        "400":
          description: "Token invalido, expirado ou senha fraca"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Token ja utilizado ou conta em estado invalido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/admin/users:
    get:
      tags:
      - Admin Users
      summary: Listar contas gerenciadas de forma paginada
      description: Retorna usuarios filtrados por status e ordenados por campos permitidos.
      operationId: listManagedUsers
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: created_at
      - name: direction
        in: query
        required: false
        schema:
          type: string
          default: desc
      responses:
        "200":
          description: Pagina de usuarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersPageResponse"
        "400":
          description: Parametros de paginacao ou ordenacao invalidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Sem privilegio administrativo
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
    post:
      tags:
      - Admin Users
      summary: Criar conta gerenciada com convite de ativacao
      description: Cria usuario pendente de ativacao e retorna token de ativacao de
        uso unico.
      operationId: createManagedUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManagedUserRequest"
        required: true
      responses:
        "201":
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedManagedUserResponse"
        "400":
          description: Entrada invalida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Sem privilegio administrativo
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Email ja cadastrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/v1/admin/users/{userId}/suspend:
    post:
      tags:
      - Admin Users
      summary: Suspender conta de usuario e revogar sessoes
      description: Bloqueia imediatamente a conta alvo e revoga todas as sessoes ativas.
      operationId: suspendManagedUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Usuario suspenso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummaryResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Sem privilegio administrativo
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Usuario nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Auto-suspensao ou conta ja suspensa
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/v1/system/status:
    get:
      tags:
      - System
      summary: Consultar status basico da API v1
      description: Retorna metadados operacionais nao sensiveis da API v1.
      operationId: getSystemStatus
      responses:
        "200":
          description: Servico operacional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"
        "500":
          description: Erro interno sanitizado em RFC 9457
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/conversations/{conversationId}:
    get:
      tags:
      - Conversations
      summary: Consultar historico completo de mensagens e geracoes de uma conversa
      operationId: getConversationHistory
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Historico retornado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationHistoryResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Conversa nao encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/auth/sessions:
    get:
      tags:
      - Multi-Client Auth
      summary: Listar sessoes ativas do proprio usuario
      operationId: listOwnSessions
      responses:
        "200":
          description: Sessoes ativas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummaryResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/auth/me:
    get:
      tags:
      - Multi-Client Auth
      summary: Consultar perfil e sessao do usuario autenticado
      description: Retorna metadados da conta e da sessao atual sem credenciais ou
        segredos de IA.
      operationId: getCurrentUser
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags:
      - Multi-Client Auth
      summary: Revogar uma sessao especifica do proprio usuario
      operationId: revokeOwnSession
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Sessao revogada
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Sessao nao encontrada para este usuario
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
components:
  schemas:
    CreateConversationRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
          minLength: 0
        modelId:
          type: string
          maxLength: 120
          minLength: 0
      required:
      - title
    ConversationSummaryResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        modelId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    SendMessageRequest:
      type: object
      properties:
        content:
          type: string
          maxLength: 16000
          minLength: 0
      required:
      - content
    GenerationSummaryResponse:
      type: object
      properties:
        id:
          type: string
        modelId:
          type: string
        status:
          type: string
        promptTokens:
          type: integer
          format: int32
        completionTokens:
          type: integer
          format: int32
        totalTokens:
          type: integer
          format: int32
        errorCode:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    MessageExchangeResponse:
      type: object
      properties:
        userMessage:
          $ref: "#/components/schemas/MessageResponse"
        assistantMessage:
          $ref: "#/components/schemas/MessageResponse"
        generation:
          $ref: "#/components/schemas/GenerationSummaryResponse"
    MessageResponse:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
        content:
          type: string
        sequenceNum:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - email
      - password
    WebLoginResponse:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
        sessionExpiresAt:
          type: string
          format: date-time
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 256
          minLength: 0
      required:
      - refreshToken
    TokenPairResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
        userId:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
    PkceTokenRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 256
          minLength: 0
        clientId:
          type: string
          maxLength: 64
          minLength: 0
        redirectUri:
          type: string
          maxLength: 512
          minLength: 0
        codeVerifier:
          type: string
          maxLength: 128
          minLength: 43
      required:
      - clientId
      - code
      - codeVerifier
      - redirectUri
    PkceAuthorizeRequest:
      type: object
      properties:
        clientId:
          type: string
          maxLength: 64
          minLength: 0
        redirectUri:
          type: string
          maxLength: 512
          minLength: 0
        codeChallenge:
          type: string
          maxLength: 128
          minLength: 43
        codeChallengeMethod:
          type: string
          maxLength: 16
          minLength: 0
        state:
          type: string
          maxLength: 256
          minLength: 0
      required:
      - clientId
      - codeChallenge
      - codeChallengeMethod
      - redirectUri
    PkceAuthorizeResponse:
      type: object
      properties:
        authorizationCode:
          type: string
        redirectUri:
          type: string
        state:
