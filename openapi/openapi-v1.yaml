    IngestKnowledgeSourceRequest:
      type: object
      description: Payload para ingestao ou atualizacao de uma fonte de conhecimento
        do projeto
      properties:
        sourcePath:
          type: string
          description: Caminho relativo seguro dentro do projeto (arquivos sensiveis
            como .env sao bloqueados)
