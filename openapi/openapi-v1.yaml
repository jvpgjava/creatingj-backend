      - name: limit
        in: query
        description: Quantidade maxima de jobs retornados (1..50)
        required: false
        schema:
          type: integer
          format: int32
          default: 20
        example: 20
      responses:
        "200":
          description: Lista de jobs de indexacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeIndexJobsResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Projeto nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/projects/{projectId}/agent/runs/{runId}:
