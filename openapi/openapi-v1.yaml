        approvalStatus:
          type: string
          description: "Estado da aprovacao (AUTO_APPROVED, PENDING, APPROVED, REJECTED,\
            \ DENIED_BY_POLICY)"
          example: PENDING
        decidedAt:
          type:
          - string
          - "null"
          format: date-time
          description: Instante UTC da decisao humana (nulo enquanto pendente)
          example: 2026-11-22T18:16:00Z
        createdAt:
          type: string
          format: date-time
          description: Instante UTC de criacao da proposta
          example: 2026-11-22T18:15:02Z
