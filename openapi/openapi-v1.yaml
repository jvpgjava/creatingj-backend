                $ref: "#/components/schemas/AdminUsageOverviewResponse"
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Sem privilegio administrativo
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/projects/{projectId}/knowledge/sources/{sourceId}:
    delete:
      tags:
      - Knowledge RAG
      summary: Excluir fonte de conhecimento e seus vetores
      operationId: deleteKnowledgeSource
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Fonte e vetores removidos
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Projeto ou fonte nao encontrados
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags:
      - Multi-Client Auth
      summary: Revogar uma sessao especifica do proprio usuario
      operationId: revokeOwnSession
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Sessao revogada
        "401":
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Sessao nao encontrada para este usuario
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
      - cookieAuth: []
