spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${CREATINGJ_DB_URL:jdbc:postgresql://localhost:5432/creatingj}
    username: ${CREATINGJ_DB_USER:postgres}
    password: ${CREATINGJ_DB_PASSWORD:postgres}

creatingj:
  docs:
    public-access: true
  security:
    cookie:
      secure: false
    cors:
      allowed-origins:
        - http://localhost:4200
  provider:
    ai:
      require-api-key: false
      strict-url-validation: true
