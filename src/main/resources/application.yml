spring:
  application:
    name: creatingj-backend
  datasource:
    url: ${CREATINGJ_DB_URL:}
    username: ${CREATINGJ_DB_USER:}
    password: ${CREATINGJ_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
    connection-timeout: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      show-components: never

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /api-docs/ui
    enabled: true

creatingj:
  docs:
    public-access: false
  provider:
    ai:
      base-url: ${CRJ_API_BASE_URL:https://api.trystac.com/v1}
      api-key: ${CRJ_API_KEY:}
      chat-model: ${CRJ_CHAT_MODEL:z-ai/glm-5.3-flash}
      embedding-model: ${CRJ_EMBEDDING_MODEL:}
      require-api-key: false
      strict-url-validation: true
  knowledge:
    embedding:
      provider: ${CRJ_EMBEDDING_PROVIDER:local-hash}
      base-url: ${CRJ_EMBEDDING_BASE_URL:${CRJ_API_BASE_URL:https://api.trystac.com/v1}}
      api-key: ${CRJ_EMBEDDING_API_KEY:${CRJ_API_KEY:}}
      model: ${CRJ_EMBEDDING_MODEL:}
      dimensions: 384
      timeout-seconds: 15
      strict-url-validation: true
  retention:
    expired-sessions-days: 30
    expired-pairing-challenges-days: 7
    completed-tasks-days: 90
    archived-conversations-days: 90
    audit-events-days: 180

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSX} %-5level [%thread] [traceId=%X{traceId:-none}] %logger{36} - %msg%n"
