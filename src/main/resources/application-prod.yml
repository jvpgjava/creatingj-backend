server:
  address: 127.0.0.1

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

creatingj:
  docs:
    public-access: false
  security:
    cookie:
      secure: true
  provider:
    ai:
      require-api-key: true
      strict-url-validation: true
  retention:
    expired-sessions-days: 30
    expired-pairing-challenges-days: 7
    completed-tasks-days: 90
    archived-conversations-days: 90
    audit-events-days: 180
